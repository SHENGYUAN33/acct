# AcctAssist — 客戶攜帶式部署 Nginx 設定
# Cloudflare Tunnel 負責 HTTPS 終止，本設定只需監聽 HTTP port 80

upstream backend {
    # "backend" 是 docker-compose.yml 中的 service 名稱
    server backend:8000;
}

server {
    listen 80;

    client_max_body_size 15M;

    # ── 後端通用 proxy headers ──────────────────────────────────────
    # X-Forwarded-Proto 硬寫 https：Cloudflare Tunnel 從外部提供 HTTPS，
    # 傳入 Nginx 時已是 HTTP，但 main.py 的 LIFF URL 注入需要 https 協定
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;

    # ── LINE Webhook ─────────────────────────────────────────────────
    location /webhook {
        proxy_pass         http://backend;
        proxy_read_timeout 60s;
    }

    # ── LIFF 頁面（FastAPI 動態注入 API base URL）──────────────────
    location ~ ^/liff-(app|single) {
        proxy_pass http://backend;
    }

    # ── API 路由（OCR 可能需要 120s）────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_read_timeout 120s;
    }

    # ── 發票圖片靜態檔案 ─────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend;
    }

    # ── 健康檢查 / FastAPI Docs ──────────────────────────────────────
    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass http://backend;
    }

    # ── 其他後端路由 ─────────────────────────────────────────────────
    location ~ ^/(auth|admin|roster)/ {
        proxy_pass http://backend;
    }

    # ── Vue 3 SPA（frontend/dist 掛載至 /usr/share/nginx/html）──────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
