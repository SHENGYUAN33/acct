# AcctAssist — GCP VM Host Nginx Configuration
# Place at: /etc/nginx/sites-available/acctassist
# Enable:   sudo ln -sf /etc/nginx/sites-available/acctassist /etc/nginx/sites-enabled/acctassist
#
# After Certbot runs, it will auto-insert the ssl_certificate lines.
# Replace YOUR_DOMAIN with your actual domain name before use.

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # Certbot will auto-populate these after: certbot --nginx -d YOUR_DOMAIN
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Allow up to 15 MB uploads (backend limit is 10 MB; extra for multipart overhead)
    client_max_body_size 15M;

    # ── Backend proxy headers (required for LIFF URL injection in main.py) ──
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── LINE Webhook ──
    location /webhook {
        proxy_pass         http://backend;
        proxy_read_timeout 60s;
    }

    # ── LIFF pages (rendered by FastAPI — injects API base URL using forwarded headers) ──
    location ~ ^/liff-(app|single) {
        proxy_pass         http://backend;
    }

    # ── FastAPI API routes (OCR may be slow → 120s timeout) ──
    location /api/ {
        proxy_pass         http://backend;
        proxy_read_timeout 120s;
    }

    # ── Static uploads (served by FastAPI StaticFiles) ──
    location /uploads/ {
        proxy_pass         http://backend;
        expires            7d;
        add_header         Cache-Control "public, immutable";
    }

    # ── Health check and API docs ──
    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass http://backend;
    }

    # ── Auth and admin routes ──
    location ~ ^/(auth|admin|roster|liff)/ {
        proxy_pass         http://backend;
        proxy_read_timeout 30s;
    }

    # ── Vue 3 SPA (frontend/dist synced to /var/www/acctassist by CI/CD) ──
    root /var/www/acctassist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
