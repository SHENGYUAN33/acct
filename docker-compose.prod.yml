version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: acctassist_db
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acctassist}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    container_name: acctassist_backend
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"
