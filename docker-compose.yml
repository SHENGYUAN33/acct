version: "3.9"

services:
  backend:
    build: .
    container_name: acctassist_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"

  db:
    image: postgres:16-alpine
    container_name: acctassist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acctassist
      POSTGRES_PASSWORD: acctassist
      POSTGRES_DB: acctassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acctassist"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
