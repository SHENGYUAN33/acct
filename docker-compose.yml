version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: acctassist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acctassist
      POSTGRES_PASSWORD: acctassist
      POSTGRES_DB: acctassist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acctassist"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
